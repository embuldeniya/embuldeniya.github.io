<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyan-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="neon-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cross Body Background Shadow / Glow -->
  <rect x="192" y="64" width="128" height="384" rx="16" fill="url(#cyan-blue-grad)" opacity="0.15" filter="url(#glow)"/>
  <rect x="64" y="192" width="384" height="128" rx="16" fill="url(#cyan-blue-grad)" opacity="0.15" filter="url(#glow)"/>

  <!-- Main Cross Contour -->
  <path d="M192 64h128v128h128v128h-128v128h-128v-128h-128v-128h128z" fill="none" stroke="url(#cyan-blue-grad)" stroke-width="12" stroke-linejoin="round"/>
  
  <!-- Right Solid Wing -->
  <path d="M256 192h192v128h-192z" fill="url(#neon-glow)" fill-opacity="0.85"/>
  <path d="M256 64h64v128h-64z" fill="#00f2fe" fill-opacity="0.9"/>
  
  <!-- Circuit Nodes & Traces (Left & Bottom) -->
  <g stroke="#38bdf8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="230" cy="150" r="10" fill="#00f2fe"/>
    <path d="M230 160v60h-60"/>
    <circle cx="170" cy="220" r="8" fill="#38bdf8"/>
    
    <circle cx="200" cy="110" r="8" fill="#00f2fe"/>
    <path d="M200 118v42h-40v40h-50"/>
    <circle cx="110" cy="200" r="8" fill="#60a5fa"/>

    <circle cx="110" cy="256" r="8" fill="#3b82f6"/>
    <path d="M118 256h62v62"/>
    <circle cx="180" cy="318" r="8" fill="#38bdf8"/>

    <circle cx="110" cy="290" r="8" fill="#2563eb"/>
    <path d="M118 290h82v40h40v60"/>
    <circle cx="240" cy="390" r="8" fill="#0ea5e9"/>

    <circle cx="270" cy="410" r="10" fill="#00f2fe"/>
    <path d="M270 400v-50h-40"/>
  </g>
</svg>
